name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        with:
          # Use a fine-grained PAT so that tags and releases created by
          # release-please trigger downstream workflows. Tokens attributed
          # to GITHUB_TOKEN cannot fire other workflow runs (GitHub's
          # recursion-prevention rule), which leaves the PyPI / MCP
          # Registry pipeline dormant on every release. The PAT's author
          # is a real user, so release.published propagates normally.
          #
          # The secret needs Contents + Pull requests + Metadata at
          # minimum. Falls back to GITHUB_TOKEN when the secret is unset,
          # which lets PR CI keep working on forks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
